# PipelineX 配置文件示例
# 请复制此文件并重命名为 pipelinex.conf，然后根据实际情况修改配置

[mysql]
# MySQL 数据库连接配置
host = 127.0.0.1
port = 3306
user = root
password = your_mysql_password
database = pipelinex

[redis]
# Redis 连接配置
host = 127.0.0.1
port = 6379
password = your_redis_password

[api]
# 后端 API 及 Websocket 服务启动配置
host = 0.0.0.0
port = 8000
